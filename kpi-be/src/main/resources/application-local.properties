# ─── Database ───────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/kpi_dev?stringtype=unspecified
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── Server ──────────────────────────────────────────────────────────────────────
server.port=8081
server.servlet.context-path=/api

# ─── MyBatis ─────────────────────────────────────────────────────────────────────
mybatis.mapper-locations=classpath:mappers/**/*.xml
mybatis.type-handlers-package=com.company.kpi.common.mybatis
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-fetch-size=100
mybatis.configuration.default-statement-timeout=30

# ─── JWT ─────────────────────────────────────────────────────────────────────────
jwt.secret=kpi-super-secret-key-2026-dev-ok
jwt.access-token.expiration=18000000
jwt.refresh-token.expiration=604800000

# ─── Email (SMTP) ────────────────────────────────────────────────────────────────
# Thay YOUR_GMAIL và YOUR_APP_PASSWORD bằng thông tin thực tế của bạn.
# Hướng dẫn lấy App Password Gmail:
#   1. Vào https://myaccount.google.com/security
#   2. Bật "Xác minh 2 bước"
#   3. Vào https://myaccount.google.com/apppasswords → Tạo mật khẩu ứng dụng mới
#   4. Copy 16 ký tự và điền vào spring.mail.password bên dưới

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_GMAIL@gmail.com
spring.mail.password=YOUR_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Đặt thành false để tắt gửi email thật (chỉ log)
app.mail.enabled=true

# ─── Sensitive data encryption ───────────────────────────────────────────────────
# Khuyến nghị set qua ENV: APP_DATA_ENCRYPTION_KEY (không commit key thật)
app.security.encryption-key=${APP_DATA_ENCRYPTION_KEY:}
# Direct encryption for score columns (no new DB columns):
# encrypted_score = score * factor + offset ; decrypt = (encrypted_score - offset) / factor
app.security.score.factor=${APP_SECURITY_SCORE_FACTOR:111}
app.security.score.offset=${APP_SECURITY_SCORE_OFFSET:222}
app.security.score.threshold=${APP_SECURITY_SCORE_THRESHOLD:5}

# ─── KPI evidence files ───────────────────────────────────────────────────────────
# Docker: set KPI_FILE_UPLOAD_DIR=/data (volume ./data:/data)
app.file.upload-dir=${KPI_FILE_UPLOAD_DIR:D:/Projects/KPI-L/data}

# ─── Logging ─────────────────────────────────────────────────────────────────────
logging.level.com.company.kpi=DEBUG
logging.level.org.springframework.security=WARN
